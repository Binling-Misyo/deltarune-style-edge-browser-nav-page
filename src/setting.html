<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>设置</title>
    <link rel="stylesheet" href="../CSS/css.css">
    <link rel="stylesheet" href="../CSS/uistyle.css">
</head>
<body class="setting-page" lang="zh">
    <div class="dhl" lang="zh">
        <h1>设置</h1>
        <ul class="dhbql" lang="zh">
            <li><a href="main.html">主页</a></li>
        </ul>
    </div>
    <p class="notice" style="background-color: black;font-size: 30px;"></p>
    <div class="editLink">
        <div class="left">
            <h2 style="text-align: left;margin-top: 30px;margin-left: 30px;display: block;">
                <img src="../image/deter.png" alt="" width: 20px;height: 20px;background-size:20%;">
                自定义导航项
            </h2>
            <p style="text-align: left;margin-top: 10px;margin-left: 30px;color: rgb(177, 177, 177);">在此处添加您喜欢的网站链接，方便快速访问。</p><br>
            <div class="baseBlock newLink" lang="zh">
                <from>
                    <label >
                        网站名称：<input class="inputText" type="text" name="siteName" placeholder="例如：GitHub" id="newLinkName">
                    </label><br>    
                    <label>
                        网站链接：<input class="inputText" type="url" name="siteURL" placeholder="例如：https://github.com" id="newLinkURL">
                    </label><br>
                    <label>选择图标：</label>
                    <div class="linkIconChose" role="radiogroup" aria-label="导航图标预设">
                        <label class="linkIcon-option">
                            <input type="radio" name="linkIcon" checked value="toby">
                            <span class="linkIcon-tile"><img src="../image/dog.webp" alt="Toby"></span>
                        </label>
                        <label class="linkIcon-option">
                            <input type="radio" name="linkIcon" value="sans">
                            <span class="linkIcon-tile"><img src="../image/sans.png" alt="Sans"></span>
                        </label>
                        <label class="linkIcon-option">
                            <input type="radio" name="linkIcon" value="flower">
                            <span class="linkIcon-tile"><img src="../image/flower.webp" alt="Flowey"></span>
                        </label>
                        <label class="linkIcon-option">
                            <input type="radio" name="linkIcon" value="r羊">
                            <span class="linkIcon-tile"><img src="../image/r羊.png" alt="Ralsei"></span>
                        </label>
                        <label class="linkIcon-option">
                            <input type="radio" name="linkIcon" value="chara">
                            <span class="linkIcon-tile"><img src="../image/chara.png" alt="Chara"></span>
                        </label>
                    </div>
                    <br>
                    <button type="button" class="baseBlock" id="addButton" style="margin-left: 10px;margin-bottom: 30px;text-align: center;display: block;width: 90%;height: 50px;">
                        <span class="buttonText" style="font-size: 30px;">确认添加</span>
                    </button>
                </from>
            </div>
        </div>
        <div class="right">
            <h2 style="text-align: left;margin-top: 30px;margin-left: 30px;display: block;">
                <img src="../image/deter.png" alt="" width: 20px;height: 20px;background-size:20%;">
                已添加的导航项
            </h2>
            <p style="text-align: left;margin-top: 10px;margin-left: 30px;color: rgb(177, 177, 177);">在此处编辑已添加的导航项</p><br>
            <div class="baseBlock" style="height: 500px;margin: 10px;">
                <div class="linkList baseBlock" id="linkListContainer">
                    <!-- 已添加的链接将显示在这里 -->
                </div>
                <div class="page">
                    <span class="buttonText" id="pgupButton">上一页</span>
                    <span class="buttonText" id="pgdownButton">下一页</span>
                </div>
            </div>
        </div>
    </div>
    <br>
    <span class="buttonText" id="toDefaultLink" style="font-size: 30px;user-select: none;display: block;margin-left: 70%;">恢复默认导航列表</span>   
    <p style="text-align: left;margin-bottom: 10px;margin-left: 10%;">*因W3C标准限制,音效功能暂不可用</p>

        </div>
    </div> -->

</body>
</html>
